{% extends 'base.html' %}
{% block auth_content %}
<div class="auth-wrapper" style="justify-content: center; align-items: center; min-height: 100vh;">
  <div class="card" style="width: 100%; max-width: 440px; padding: 2.5rem; text-align: center;">
    <div style="display: inline-flex; width: 54px; height: 54px; border-radius: var(--radius-full); background: var(--success-light); color: var(--success); align-items: center; justify-content: center; font-size: 1.6rem; margin-bottom: 1rem;">
      <i class="fa-solid fa-envelope-circle-check"></i>
    </div>
    <h2>Reset Email Sent</h2>
    <p style="color: var(--text-muted); font-size: 0.95rem; margin: 1rem 0 1.5rem 0;">
      We've emailed you instructions for setting your new password. If an account exists with the email you entered, you will receive it shortly.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary" style="width: 100%;">
      Return to Sign In
    </a>
  </div>
</div>
{% endblock %}
