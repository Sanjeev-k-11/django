{% extends 'base.html' %}
{% load static %}

{% block content %}
<div style="max-width: 550px; margin: 0 auto;">
  <div class="card">
    <div class="card-header">
      <div class="card-title">
        <i class="fa-solid fa-key" style="color: var(--primary);"></i>
        <span>Change Account Password</span>
      </div>
    </div>

    <form method="POST">
      {% csrf_token %}

      {% for field in form %}
        <div class="form-group">
          <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
          <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}" id="{{ field.id_for_label }}" class="form-input" required>
          {% if field.help_text %}
            <div class="form-help-text">{{ field.help_text|safe }}</div>
          {% endif %}
          {% if field.errors %}
            <div class="form-error">{{ field.errors.0 }}</div>
          {% endif %}
        </div>
      {% endfor %}

      <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
        <a href="{% url 'accounts:profile' %}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">
          <i class="fa-solid fa-check"></i>
          <span>Update Password</span>
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
