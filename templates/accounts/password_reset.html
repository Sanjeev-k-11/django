{% extends 'base.html' %}
{% load static %}

{% block auth_content %}
<div class="auth-wrapper" style="justify-content: center; align-items: center; min-height: 100vh;">
  <div class="card" style="width: 100%; max-width: 440px; padding: 2.5rem;">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <div style="display: inline-flex; width: 48px; height: 48px; border-radius: var(--radius-sm); background: var(--warning-light); color: var(--warning); align-items: center; justify-content: center; font-size: 1.4rem; margin-bottom: 0.75rem;">
        <i class="fa-solid fa-unlock-keyhole"></i>
      </div>
      <h2>Forgot Password?</h2>
      <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.25rem;">
        Enter your registered email and we'll send you password recovery instructions.
      </p>
    </div>

    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="id_email">Email Address</label>
        <input type="email" name="email" id="id_email" class="form-input" placeholder="name@example.com" required autocomplete="email">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 0.5rem;">
        <i class="fa-regular fa-paper-plane"></i>
        <span>Send Reset Link</span>
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem;">
      <a href="{% url 'accounts:login' %}" style="font-size: 0.95rem;">
        <i class="fa-solid fa-arrow-left"></i> Back to Sign In
      </a>
    </div>
  </div>
</div>
{% endblock %}
