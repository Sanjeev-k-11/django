{% extends 'base.html' %}
{% load static %}

{% block content %}
<div style="max-width: 500px; margin: 3rem auto;">
  <div class="card" style="border-top: 5px solid var(--danger); text-align: center; padding: 2rem;">
    <div style="display: inline-flex; width: 60px; height: 60px; border-radius: var(--radius-full); background: var(--danger-light); color: var(--danger); align-items: center; justify-content: center; font-size: 1.8rem; margin-bottom: 1.25rem;">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>

    <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Delete {{ type }}?</h2>
    <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 1.75rem;">
      Are you sure you want to permanently delete <strong>"{{ object }}"</strong>? This action cannot be undone.
    </p>

    <form method="POST">
      {% csrf_token %}
      <div style="display: flex; justify-content: center; gap: 1rem;">
        <a href="{% if cancel_url %}{% url cancel_url %}{% else %}{% url 'core:dashboard' %}{% endif %}" class="btn btn-secondary">
          Cancel
        </a>
        <button type="submit" class="btn btn-danger">
          <i class="fa-solid fa-trash-can"></i> Yes, Permanently Delete
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
