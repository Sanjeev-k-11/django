{% extends 'base.html' %}
{% load static %}

{% block content %}
<div style="max-width: 550px; margin: 4rem auto; text-align: center;">
  <div class="card" style="padding: 3rem 2rem;">
    <div style="font-size: 4.5rem; font-weight: 700; color: var(--danger); line-height: 1;">500</div>
    <h2 style="font-size: 1.6rem; margin: 1rem 0 0.5rem 0;">Internal Server Error</h2>
    <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem;">
      Something went wrong on our end. Please try refreshing or return to your main dashboard.
    </p>
    <a href="{% url 'core:dashboard' %}" class="btn btn-primary">
      <i class="fa-solid fa-house"></i> Return to Study Dashboard
    </a>
  </div>
</div>
{% endblock %}
