{% extends 'base.html' %}
{% load static %}

{% block content %}
<div style="max-width: 550px; margin: 4rem auto; text-align: center;">
  <div class="card" style="padding: 3rem 2rem;">
    <div style="font-size: 4.5rem; font-weight: 700; color: var(--primary); line-height: 1;">404</div>
    <h2 style="font-size: 1.6rem; margin: 1rem 0 0.5rem 0;">Page Not Found</h2>
    <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem;">
      The study resource, assignment, or page you are looking for doesn't exist or may have been deleted.
    </p>
    <a href="{% url 'core:dashboard' %}" class="btn btn-primary">
      <i class="fa-solid fa-house"></i> Return to Study Dashboard
    </a>
  </div>
</div>
{% endblock %}
